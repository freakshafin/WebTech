<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CSS Test</title>
    <link rel="stylesheet" href="Practise1(style).css">
</head>
<body>
    <form>
        <h2>Donor Information</h2>
        <table border="1">
            <tr>
                <td align="right" width="30%"><label for="fname">First Name:</label></td>
                <td><input type="text" id="fname"></td>
            </tr>
            <tr>
                <td align="right"><label for="email">Email:</label></td>
                <td><input type="email" id="email"></td>
            </tr>
            <tr>
                <td align="right"><label for="state">State:</label></td>
                <td>
                    <select id="state">
                        <option>Select a State</option>
                        <option>Alabama</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td align="right" valign="top"><label for="comments">Comments:</label></td>
                <td>
                    <span class="hint-text">(Please type any questions here)</span><br>
                    <textarea id="comments" rows="3"></textarea>
                </td>
            </tr>
        </table>

        <p class="recurring-text">Monthly Credit Card $ <input type="text" style="width:60px;"> For <input type="text" style="width:40px;"> Months</p>

        <p class="pub-instruction">Please enter your name as you would like it to appear:</p>

        <p class="checkbox-group">
            <input type="checkbox" id="a"> <label for="a">Remain anonymous.</label><br>
            <input type="checkbox" id="b"> <label for="b">Employer offers matching gifts.</label>
        </p>

        <p class="action-buttons">
            <input type="reset" value="Reset">
            <input type="submit" value="Continue">
        </p>

        <p class="footer-note">🔒 You are on a secure server.</p>
        <p class="footer-note">Contact support if you have problems.</p>
    </form>
</body>
</html>
